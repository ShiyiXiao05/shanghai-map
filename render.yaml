# Render 部署蓝图：https://render.com/docs/blueprint-spec
# 敏感环境变量（sync: false）在 Render 控制台或 CLI 设置，不进仓库
services:
  - type: web
    name: shanghai-wish-map
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ACCESS_CODE
        sync: false
      - key: AMAP_KEY
        sync: false
      - key: AMAP_SECURITY_CODE
        sync: false
