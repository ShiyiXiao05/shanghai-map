# Render 部署蓝图：https://render.com/docs/blueprint-spec
# 敏感环境变量（sync: false）在 Render 控制台或 CLI 设置，不进仓库
services:
  - type: web
    name: shanghai-wish-map
    runtime: node
    plan: free
    region: singapore
    # 使用仓库根目录，使 server/index.js 可以访问 ../public（网页及 Android 更新文件）
    # npm ci：严格按 package-lock.json 安装，构建可复现（npm install 可能引入未锁定版本）
    buildCommand: npm --prefix server ci
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AMAP_KEY
        sync: false
      - key: AMAP_SECURITY_CODE
        sync: false
      - key: CLOUDINARY_URL
        sync: false
