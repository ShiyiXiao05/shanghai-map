<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>想去上海 · 同学共享地点地图</title>
  <meta name="description" content="和同学一起在地图上标记想去的上海地点" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%2314584a'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23f5f2ea' font-family='serif'%3E沪%3C/text%3E%3C/svg%3E" />
  <script>
    (function () {
      var saved = localStorage.getItem('wish-theme') || 'auto';
      var theme = saved === 'auto'
        ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'tokyo' : 'celadon')
        : saved;
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="map-stage">
    <div id="map" class="map"></div>

    <header class="top-bar">
      <div class="brand">
        <span class="brand-badge" aria-hidden="true">沪</span>
        <div class="brand-text">
          <h1>想去上海</h1>
          <p>同学共享 · 地点收藏</p>
        </div>
      </div>
      <div class="search-wrap">
        <input id="search-input" type="search" autocomplete="off"
               placeholder="搜索地点，比如「武康路」" aria-label="搜索地点" />
        <div id="search-suggest" class="search-suggest" hidden></div>
      </div>
      <button id="btn-pick" class="btn btn-primary" type="button">＋ 地图选点</button>
    </header>

    <div class="pick-hint" id="pick-hint" hidden>
      点击地图上的位置，会自动匹配附近的地点 · <button id="btn-pick-cancel" type="button">取消</button>
    </div>

    <aside class="side-panel" id="sidebar">
      <div class="filters">
        <div class="category-chips" id="category-chips" role="group" aria-label="按分类筛选"></div>
        <label class="unvisited-toggle">
          <input type="checkbox" id="toggle-unvisited" />
          只看还没去的
        </label>
      </div>
      <ul class="place-list" id="place-list"></ul>
      <div class="empty-state" id="empty-state" hidden>
        <p class="empty-icon" aria-hidden="true">🗺️</p>
        <p class="empty-title">还没有标记任何地点</p>
        <p>用上方搜索，或在地图上点选一个位置，<br />把大家想去的地方都记下来。</p>
      </div>
      <div class="sidebar-foot">
        <select id="theme-select" class="theme-select" aria-label="配色方案"></select>
        <button id="btn-code" class="btn-link" type="button">修改编辑口令</button>
      </div>
    </aside>

    <div class="map-fallback" id="map-fallback" hidden>
      <div class="map-fallback-card">
        <p class="fallback-title">地图尚未启用</p>
        <p>服务端还没有配置高德地图 key（AMAP_KEY）。地点列表和添加功能可以正常使用，配上 key 后这里就会显示上海地图。</p>
      </div>
    </div>
  </div>

  <dialog id="place-dialog" class="dialog">
    <form id="place-form" method="dialog">
      <h2 id="place-dialog-title">添加地点</h2>
      <div class="form-grid">
        <label class="field field-name">
          <span>名称</span>
          <input name="name" required maxlength="100" placeholder="比如：武康路" />
        </label>
        <label class="field field-category">
          <span>分类</span>
          <select name="category" id="form-category"></select>
        </label>
        <label class="field field-desc">
          <span>描述</span>
          <textarea name="description" maxlength="500" rows="3"
            placeholder="为什么想去、和谁去、要注意什么……"></textarea>
        </label>
        <label class="field field-address">
          <span>地址</span>
          <input name="address" maxlength="200" placeholder="选填，搜索定位后会自动带上" />
        </label>
        <label class="field field-nickname">
          <span>你的昵称</span>
          <input name="added_by" maxlength="30" placeholder="记录是谁想去的" />
        </label>
        <label class="field field-coords">
          <span>坐标</span>
          <output id="form-coords">未选择（搜索或地图选点后自动填入）</output>
        </label>
        <label class="field field-visited" id="field-visited" hidden>
          <input type="checkbox" name="visited" />
          <span>已经去过啦</span>
        </label>
      </div>
      <div class="form-actions">
        <button type="button" class="btn" id="btn-place-cancel">取消</button>
        <button type="submit" class="btn btn-primary" id="btn-place-save">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="pick-dialog" class="dialog dialog-pick">
    <div class="pick-body">
      <h2>选一个准确的位置</h2>
      <p class="dialog-hint" id="pick-raw-hint">你点击的位置：</p>
      <div class="pick-candidates" id="pick-candidates"></div>
      <div class="form-actions">
        <button type="button" class="btn" id="btn-pick-cancel-dialog">取消</button>
        <button type="button" class="btn btn-primary" id="btn-pick-raw">就用点击的位置</button>
      </div>
    </div>
  </dialog>

  <dialog id="code-dialog" class="dialog dialog-narrow">
    <form id="code-form" method="dialog">
      <h2>输入编辑口令</h2>
      <p class="dialog-hint">添加和修改地点需要共享口令，问一下建站的同学就有。</p>
      <label class="field">
        <span>口令</span>
        <input name="code" type="password" required autocomplete="off" />
      </label>
      <div class="form-actions">
        <button type="button" class="btn" id="btn-code-cancel">取消</button>
        <button type="submit" class="btn btn-primary">确定</button>
      </div>
    </form>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
