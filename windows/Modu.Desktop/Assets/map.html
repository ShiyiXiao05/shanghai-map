<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;font-family:'Microsoft YaHei UI',sans-serif;background:#e7ece3}#notice{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;color:#52645a;text-align:center;padding:40px;box-sizing:border-box;font-size:14px;line-height:2}.marker{width:38px;height:38px;border-radius:50%;background:white;box-shadow:0 3px 12px #253b3333;border:2px solid white;display:flex;align-items:center;justify-content:center;font-size:23px}.marker.selected{border-color:#345e4f;transform:scale(1.15)}.marker.visited::after{content:'✓';position:absolute;right:-4px;bottom:-4px;border:2px solid white;background:#345e4f;color:white;border-radius:50%;font:11px sans-serif;width:16px;height:16px;text-align:center;line-height:16px}.amap-logo,.amap-copyright{opacity:.7}
</style></head><body><div id="map"></div><div id="notice">开启地图服务后，在这里探索城市。<br>地点列表与管理功能可独立使用。</div><script>
let map,markers=new Map(),latest=[],selected=null,route=[],pick=false,initial=true,dark=false;
function send(type,data={}){window.chrome.webview.postMessage({type,...data});}
function notice(text){document.getElementById('notice').textContent=text;document.getElementById('notice').style.display='flex';}
window.initMap=function(config){
 if(map)return;
 window._AMapSecurityConfig={securityJsCode:config.securityJsCode||config.security_js_code||''};
 let script=document.createElement('script');script.src='https://webapi.amap.com/maps?v=2.0&key='+encodeURIComponent(config.key);script.onerror=()=>{notice('地图加载失败，请检查网络后重试。');send('error',{message:'地图加载失败'})};
 script.onload=()=>{try{map=new AMap.Map('map',{zoom:12,center:[121.4737,31.2304],viewMode:'2D',mapStyle:'amap://styles/whitesmoke'});map.on('complete',()=>send('ready'));map.on('click',e=>{if(pick){send('pick',{lng:e.lnglat.lng,lat:e.lnglat.lat,name:'',address:''})}});document.getElementById('notice').style.display='none';window.renderPlaces(latest,selected);window.renderRoute(route)}catch(e){notice('地图无法初始化');send('error',{message:e.message})}};document.head.appendChild(script);
};
window.renderPlaces=function(places,id){latest=places;selected=id;if(!map)return;const keep=new Set(places.map(p=>p.id));for(const [id,m]of markers){if(!keep.has(id)){map.remove(m);markers.delete(id)}}for(const p of places){let node=document.createElement('div');node.className='marker'+(p.id===id?' selected':'')+(p.visited?' visited':'');node.textContent=p.display_emoji||p.emoji||'📍';let marker=markers.get(p.id);if(marker){marker.setContent(node);marker.setPosition([p.lng,p.lat])}else{marker=new AMap.Marker({position:[p.lng,p.lat],content:node,anchor:'center',title:p.name});marker.on('click',()=>send('select',{id:p.id}));markers.set(p.id,marker);map.add(marker)}}if(initial&&places.length){initial=false;map.setFitView([...markers.values()],false,[65,65,65,65],15)}};
window.focusPlace=function(p){if(map)map.setZoomAndCenter(Math.max(map.getZoom(),15),[p.lng,p.lat]);};
window.fitPlaces=function(){if(map&&markers.size)map.setFitView([...markers.values()],false,[65,65,65,65],15)};
window.setPick=function(value){pick=value;if(map)map.setDefaultCursor(value?'crosshair':'grab')};
window.renderRoute=function(stops){route=stops;if(!map)return;if(window.line)map.remove(window.line);if(stops.length>1){window.line=new AMap.Polyline({path:stops.map(p=>[p.lng,p.lat]),strokeColor:'#345e4f',strokeWeight:4,strokeStyle:'dashed'});map.add(window.line)}};
window.searchPlaces=function(query,token){if(!map){send('search',{token,error:'请先开启地图服务',points:[]});return}AMap.plugin('AMap.PlaceSearch',()=>{const s=new AMap.PlaceSearch({city:'上海',citylimit:false,pageSize:12});s.search(query,(status,result)=>{send('search',{token,error:status==='complete'?'':('搜索未完成 · '+(result?.info||status)+'，可使用分享坐标导入'),points:(result?.poiList?.pois||[]).filter(p=>p.location).map(p=>({name:p.name,address:p.address||'',lng:p.location.lng,lat:p.location.lat}))})})})};
window.locate=function(){if(!map)return;AMap.plugin('AMap.Geolocation',()=>{let geo=new AMap.Geolocation({enableHighAccuracy:true,timeout:15000,convert:true});geo.getCurrentPosition((status,result)=>{if(status==='complete'){map.setZoomAndCenter(14,[result.position.lng,result.position.lat]);send('location',{lng:result.position.lng,lat:result.position.lat})}else send('error',{message:'定位不可用，可使用地点搜索或手动选点'})})})};
window.setTheme=function(value){dark=value;if(map)map.setMapStyle(value?'amap://styles/darkblue':'amap://styles/whitesmoke')};
window.chrome.webview.addEventListener('message',event=>{});send('loaded');
</script></body></html>
