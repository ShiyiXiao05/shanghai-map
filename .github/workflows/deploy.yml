# push 到 main 后调用 Render Deploy Hook 触发部署。
# 替代时灵时不灵的 GitHub App webhook：GitHub Actions 自家事件可靠触发。
name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 测试不过就不部署：94+ 个用例覆盖登录/鉴权/上传/内容安全/数据一致性
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install (server)
        run: npm ci
        working-directory: server

      - name: Test (server)
        run: npm test
        working-directory: server

      - name: Trigger Render deploy hook
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          echo "Render hook responded: $status"
          if [ "$status" != "200" ] && [ "$status" != "201" ] && [ "$status" != "202" ]; then
            echo "::error::Deploy hook 调用失败（HTTP $status）"
            exit 1
          fi
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
